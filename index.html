<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥟 PDV Pastelaria</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;min-height:100vh}
.header{background:linear-gradient(135deg,#c0392b,#8e1a12);padding:15px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 15px rgba(0,0,0,0.4)}
.header h1{font-size:1.4em;font-weight:700;color:#fff;letter-spacing:1px}
.header .info{font-size:0.8em;color:#ffcccc;text-align:right}
#tela-abertura{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#16213e)}
.abertura-box{background:#16213e;border:2px solid #c0392b;border-radius:20px;padding:40px;max-width:450px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.abertura-box h2{color:#c0392b;font-size:1.8em;margin-bottom:8px}
.abertura-box p{color:#aaa;margin-bottom:25px;font-size:0.9em}
.form-group{margin-bottom:18px;text-align:left}
.form-group label{display:block;color:#ccc;font-size:0.85em;margin-bottom:6px;font-weight:600}
.form-group input{width:100%;padding:12px 15px;background:#0f3460;border:2px solid #c0392b33;border-radius:10px;color:#fff;font-size:1em;transition:border-color 0.3s}
.form-group input:focus{outline:none;border-color:#c0392b}
.btn{padding:14px 28px;border:none;border-radius:10px;cursor:pointer;font-size:1em;font-weight:700;transition:all 0.3s;letter-spacing:1px}
.btn-primary{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;width:100%;margin-top:10px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(192,57,43,0.4)}
.btn-success{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
.btn-success:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(39,174,96,0.4)}
.btn-danger{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff}
.btn-warning{background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff}
.btn-secondary{background:#2c3e50;color:#ccc}
.btn-sm{padding:8px 14px;font-size:0.82em}
#tela-pdv{display:none;height:100vh;flex-direction:column}
.pdv-top{background:#16213e;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #c0392b33;flex-wrap:wrap;gap:8px}
.pdv-top .operador{font-size:0.85em;color:#aaa}
.pdv-top .data-hora{font-size:0.85em;color:#c0392b;font-weight:600}
.pdv-body{display:flex;flex:1;overflow:hidden}
.col-produtos{flex:1.5;overflow-y:auto;padding:15px;background:#1a1a2e}
.col-carrinho{width:360px;background:#16213e;display:flex;flex-direction:column;border-left:2px solid #c0392b33}
.search-bar{position:relative;margin-bottom:12px}
.search-bar input{width:100%;padding:10px 15px 10px 40px;background:#16213e;border:2px solid #c0392b33;border-radius:10px;color:#fff;font-size:0.9em}
.search-bar input:focus{outline:none;border-color:#c0392b}
.search-bar .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#c0392b;font-size:1.1em}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filtro-btn{padding:5px 12px;border:2px solid #c0392b33;border-radius:20px;background:transparent;color:#aaa;cursor:pointer;font-size:0.75em;transition:all 0.2s;white-space:nowrap}
.filtro-btn.ativo{background:#c0392b;border-color:#c0392b;color:#fff}
.produtos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.produto-card{background:#16213e;border:2px solid #c0392b22;border-radius:12px;padding:12px;cursor:pointer;transition:all 0.2s;position:relative}
.produto-card:hover{border-color:#c0392b;transform:translateY(-2px);box-shadow:0 8px 20px rgba(192,57,43,0.2)}
.produto-card .cat-tag{font-size:0.65em;color:#c0392b;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.produto-card .num{font-size:0.7em;color:#666;margin-bottom:2px}
.produto-card .nome{font-size:0.85em;font-weight:600;color:#eee;line-height:1.3;margin-bottom:8px}
.produto-card .preco{font-size:1.1em;font-weight:700;color:#27ae60}
.produto-card .add-btn{position:absolute;bottom:10px;right:10px;width:28px;height:28px;background:#c0392b;border:none;border-radius:50%;color:#fff;font-size:1.2em;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.produto-card .add-btn:hover{background:#e74c3c;transform:scale(1.1)}
.carrinho-header{padding:15px;border-bottom:2px solid #c0392b33;display:flex;align-items:center;justify-content:space-between}
.carrinho-header h3{color:#c0392b;font-size:1em}
.carrinho-items{flex:1;overflow-y:auto;padding:10px}
.item-carrinho{background:#1a1a2e;border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid #c0392b22}
.item-carrinho .nome{font-size:0.82em;color:#eee;margin-bottom:6px;line-height:1.3}
.item-ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qty-ctrl{display:flex;align-items:center;gap:6px}
.qty-btn{width:24px;height:24px;border:none;border-radius:6px;cursor:pointer;font-size:0.9em;display:flex;align-items:center;justify-content:center}
.qty-btn.minus{background:#c0392b;color:#fff}
.qty-btn.plus{background:#27ae60;color:#fff}
.qty-num{min-width:22px;text-align:center;font-weight:700;color:#fff;font-size:0.9em}
.item-preco{font-weight:700;color:#27ae60;font-size:0.9em}
.item-del{background:transparent;border:none;color:#c0392b44;cursor:pointer;font-size:1em;transition:color 0.2s}
.item-del:hover{color:#c0392b}
.carrinho-footer{padding:15px;border-top:2px solid #c0392b33;background:#0f3460}
.total-linha{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.total-linha .label{color:#aaa;font-size:0.85em}
.total-linha .valor{font-weight:700;color:#27ae60;font-size:1em}
.total-linha.grande .valor{font-size:1.5em;color:#fff}
.pgto-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.pgto-btn{padding:10px 6px;border:2px solid transparent;border-radius:8px;background:#1a1a2e;color:#aaa;cursor:pointer;font-size:0.75em;text-align:center;transition:all 0.2s}
.pgto-btn.ativo{border-color:#c0392b;color:#c0392b;background:#c0392b11}
.pgto-btn:hover{border-color:#c0392b66}
.troco-field{margin-top:8px;display:none}
.troco-field input{width:100%;padding:8px 12px;background:#1a1a2e;border:2px solid #c0392b33;border-radius:8px;color:#fff;font-size:0.9em}
.troco-result{color:#f39c12;font-size:0.85em;margin-top:4px;text-align:right}
.finalizar-btn{width:100%;margin-top:12px;padding:14px;font-size:1em}
#tela-fechamento{display:none;padding:20px;max-width:700px;margin:0 auto}
#tela-historico{display:none;padding:20px;max-width:900px;margin:0 auto}
#tela-produtos{display:none;padding:20px;max-width:900px;margin:0 auto}
.card{background:#16213e;border-radius:15px;padding:20px;margin-bottom:20px;border:1px solid #c0392b22}
.card h3{color:#c0392b;margin-bottom:15px;font-size:1.1em}
.resumo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.resumo-item{background:#1a1a2e;border-radius:10px;padding:15px;text-align:center}
.resumo-item .label{font-size:0.8em;color:#aaa;margin-bottom:5px}
.resumo-item .valor{font-size:1.4em;font-weight:700;color:#27ae60}
.resumo-item .valor.destaque{color:#c0392b}
table{width:100%;border-collapse:collapse;font-size:0.85em}
table th{background:#c0392b;color:#fff;padding:10px 12px;text-align:left}
table td{padding:8px 12px;border-bottom:1px solid #c0392b11;color:#ccc}
table tr:hover td{background:#c0392b11}
.nav-btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#16213e;border-radius:15px;padding:30px;max-width:500px;width:90%;border:2px solid #c0392b33;max-height:90vh;overflow-y:auto}
.modal-box h3{color:#c0392b;margin-bottom:20px;font-size:1.2em}
.modal-btns{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}
.badge{background:#c0392b;color:#fff;border-radius:20px;padding:2px 8px;font-size:0.7em;margin-left:5px}
.empty-state{text-align:center;padding:40px;color:#555}
.empty-state .icon{font-size:3em;margin-bottom:10px}
.obs-input{width:100%;margin-top:6px;padding:6px 10px;background:#0f3460;border:1px solid #c0392b33;border-radius:6px;color:#ccc;font-size:0.8em;resize:none}
@media(max-width:768px){.pdv-body{flex-direction:column}.col-carrinho{width:100%;max-height:45vh}.produtos-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media print{body{background:#fff;color:#000}.no-print{display:none!important}.recibo{color:#000}}
</style>
</head>
<body>
<!-- TELA ABERTURA -->
<div id="tela-abertura">
<div class="abertura-box">
  <div style="font-size:3em;margin-bottom:10px">🥟</div>
  <h2>PDV PASTELARIA</h2>
  <p>Sistema de Ponto de Venda</p>
  <div class="form-group">
    <label>Nome do Estabelecimento</label>
    <input type="text" id="nomeEstab" placeholder="Ex: Pastelaria do João" value="">
  </div>
  <div class="form-group">
    <label>Nome do Operador</label>
    <input type="text" id="nomeOperador" placeholder="Ex: Maria">
  </div>
  <div class="form-group">
    <label>Fundo de Caixa (R$)</label>
    <input type="number" id="fundoCaixa" placeholder="0,00" min="0" step="0.01">
  </div>
  <button class="btn btn-primary" onclick="abrirCaixa()">🔓 ABRIR CAIXA</button>
  <div style="margin-top:15px;display:flex;gap:8px;justify-content:center">
    <button class="btn btn-secondary btn-sm" onclick="irParaHistorico()">📋 Histórico</button>
    <button class="btn btn-secondary btn-sm" onclick="irParaProdutos()">🛒 Produtos</button>
  </div>
</div>
</div>

<!-- TELA PDV PRINCIPAL -->
<div id="tela-pdv">
<div class="pdv-top no-print">
  <div>
    <div style="font-weight:700;color:#c0392b;font-size:1.1em">🥟 <span id="topEstab">PDV Pastelaria</span></div>
    <div class="operador">Operador: <span id="topOperador">-</span></div>
  </div>
  <div class="data-hora" id="relogioTopo"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn btn-warning btn-sm" onclick="irParaFechar()">💰 Fechar Caixa</button>
    <button class="btn btn-secondary btn-sm" onclick="irParaHistorico()">📋 Histórico</button>
    <button class="btn btn-secondary btn-sm" onclick="irParaProdutos()">⚙️ Produtos</button>
  </div>
</div>
<div class="pdv-body">
  <!-- COLUNA PRODUTOS -->
  <div class="col-produtos no-print">
    <div class="search-bar">
      <span class="icon">🔍</span>
      <input type="text" id="busca" placeholder="Buscar produto..." oninput="filtrarProdutos()">
    </div>
    <div class="filtros" id="filtros"></div>
    <div class="produtos-grid" id="gridProdutos"></div>
  </div>
  <!-- COLUNA CARRINHO -->
  <div class="col-carrinho no-print">
    <div class="carrinho-header">
      <h3>🛒 Pedido <span id="numPedido">#1</span></h3>
      <button class="btn btn-danger btn-sm" onclick="limparCarrinho()">🗑️ Limpar</button>
    </div>
    <div class="carrinho-items" id="carrinho"></div>
    <div class="carrinho-footer">
      <div class="total-linha"><span class="label">Subtotal</span><span class="valor" id="subtotal">R$ 0,00</span></div>
      <div class="total-linha grande"><span class="label" style="font-size:1em;color:#fff">TOTAL</span><span class="valor" id="total">R$ 0,00</span></div>
      <div class="pgto-btns">
        <button class="pgto-btn" onclick="selecionarPgto('dinheiro')" id="pgto-dinheiro">💵 Dinheiro</button>
        <button class="pgto-btn" onclick="selecionarPgto('pix')" id="pgto-pix">📱 PIX</button>
        <button class="pgto-btn" onclick="selecionarPgto('debito')" id="pgto-debito">💳 Débito</button>
        <button class="pgto-btn" onclick="selecionarPgto('credito')" id="pgto-credito">💳 Crédito</button>
      </div>
      <div class="troco-field" id="troco-field">
        <input type="number" id="valorRecebido" placeholder="Valor recebido..." oninput="calcTroco()" step="0.01" min="0">
        <div class="troco-result" id="trocoResult"></div>
      </div>
      <div class="form-group" style="margin-top:8px">
        <textarea class="obs-input" id="obsVenda" placeholder="Observação (opcional)..." rows="2"></textarea>
      </div>
      <button class="btn btn-success finalizar-btn" onclick="finalizarVenda()">✅ FINALIZAR VENDA</button>
    </div>
  </div>
</div>
</div>

<!-- TELA FECHAMENTO -->
<div id="tela-fechamento">
<div class="nav-btns no-print">
  <button class="btn btn-secondary btn-sm" onclick="voltarPDV()">← Voltar ao PDV</button>
  <button class="btn btn-warning btn-sm" onclick="window.print()">🖨️ Imprimir</button>
</div>
<div class="card">
  <h3>💰 Fechamento de Caixa</h3>
  <div id="fechamentoConteudo"></div>
</div>
<button class="btn btn-danger no-print" onclick="fecharCaixaDefinitivo()" style="width:100%;padding:14px;font-size:1em;margin-top:10px">🔒 FECHAR CAIXA E REINICIAR</button>
</div>

<!-- TELA HISTÓRICO -->
<div id="tela-historico">
<div class="nav-btns no-print">
  <button class="btn btn-secondary btn-sm" onclick="voltarPDV()">← Voltar</button>
  <button class="btn btn-warning btn-sm" onclick="window.print()">🖨️ Imprimir</button>
</div>
<div class="card">
  <h3>📋 Histórico de Vendas</h3>
  <div id="historicoConteudo"></div>
</div>
</div>

<!-- TELA PRODUTOS -->
<div id="tela-produtos">
<div class="nav-btns no-print">
  <button class="btn btn-secondary btn-sm" onclick="voltarPDV()">← Voltar</button>
</div>
<div class="card">
  <h3>⚙️ Gerenciar Produtos</h3>
  <p style="color:#aaa;font-size:0.85em;margin-bottom:15px">Edite preços diretamente na tabela. As alterações ficam salvas no navegador.</p>
  <div id="produtosAdminConteudo"></div>
</div>
</div>

<!-- MODAL RECIBO -->
<div class="modal" id="modalRecibo">
<div class="modal-box">
  <h3>🧾 Comprovante</h3>
  <div id="reciboConteudo" class="recibo"></div>
  <div class="modal-btns no-print">
    <button class="btn btn-secondary btn-sm" onclick="fecharModal('modalRecibo')">Fechar</button>
    <button class="btn btn-warning btn-sm" onclick="window.print()">🖨️ Imprimir</button>
  </div>
</div>
</div>

// ========== ESTADO ==========
var state = {
  estab: '', operador: '', fundoCaixa: 0,
  caixaAberto: false, abertura: null,
  carrinho: [], pgto: 'dinheiro',
  numPedido: 1, vendas: [],
  produtos: []
};

// ========== INIT ==========
function init() {
  state.produtos = JSON.parse(localStorage.getItem('pdv_produtos') || 'null') || JSON.parse(JSON.stringify(PRODUTOS_DEFAULT));
  state.vendas = JSON.parse(localStorage.getItem('pdv_vendas') || '[]');
  state.numPedido = parseInt(localStorage.getItem('pdv_numPedido') || '1');
  var salvo = JSON.parse(localStorage.getItem('pdv_caixa') || 'null');
  if (salvo && salvo.aberto) {
    state.estab = salvo.estab; state.operador = salvo.operador;
    state.fundoCaixa = salvo.fundo; state.caixaAberto = true;
    state.abertura = salvo.abertura; state.numPedido = salvo.numPedido || state.numPedido;
    document.getElementById('nomeEstab').value = state.estab;
    document.getElementById('nomeOperador').value = state.operador;
    document.getElementById('fundoCaixa').value = state.fundoCaixa;
    abrirCaixa();
  }
  setInterval(atualizarRelogio, 1000);
  atualizarRelogio();
}

function atualizarRelogio() {
  var el = document.getElementById('relogioTopo');
  if (el) el.textContent = new Date().toLocaleString('pt-BR');
}

// ========== CAIXA ==========
function abrirCaixa() {
  var estab = document.getElementById('nomeEstab').value.trim();
  var op = document.getElementById('nomeOperador').value.trim();
  var fundo = parseFloat(document.getElementById('fundoCaixa').value) || 0;
  if (!estab || !op) { alert('Preencha o nome do estabelecimento e do operador!'); return; }
  state.estab = estab; state.operador = op; state.fundoCaixa = fundo;
  state.caixaAberto = true;
  if (!state.abertura) state.abertura = new Date().toISOString();
  localStorage.setItem('pdv_caixa', JSON.stringify({aberto:true,estab:estab,operador:op,fundo:fundo,abertura:state.abertura,numPedido:state.numPedido}));
  document.getElementById('topEstab').textContent = estab;
  document.getElementById('topOperador').textContent = op;
  mostrarTela('pdv');
  renderFiltros();
  renderProdutos();
  renderCarrinho();
}

// ========== NAVEGAÇÃO ==========
function mostrarTela(t) {
  ['abertura','pdv','fechamento','historico','produtos'].forEach(function(n){
    document.getElementById('tela-'+n).style.display='none';
  });
  document.getElementById('tela-'+t).style.display = (t==='pdv') ? 'flex' : 'block';
}
function voltarPDV(){mostrarTela('pdv');}
function irParaFechar(){gerarFechamento();mostrarTela('fechamento');}
function irParaHistorico(){gerarHistorico();mostrarTela('historico');}
function irParaProdutos(){gerarProdutosAdmin();mostrarTela('produtos');}

// ========== PRODUTOS ==========
var filtroAtivo = 'Todos';
function getCategorias() {
  var cats = ['Todos'];
  state.produtos.forEach(function(p){ if(cats.indexOf(p.categoria)<0) cats.push(p.categoria); });
  return cats;
}

function renderFiltros() {
  var cats = getCategorias();
  var el = document.getElementById('filtros');
  el.innerHTML = cats.map(function(c){
    return '<button class="filtro-btn'+(c===filtroAtivo?' ativo':'')+'" onclick="setFiltro(\'' + c.replace(/'/g,"\'") + '\')">' + c + '</button>';
  }).join('');
}

function setFiltro(c) {
  filtroAtivo = c;
  document.getElementById('busca').value = '';
  renderFiltros();
  renderProdutos();
}

function filtrarProdutos() {
  filtroAtivo = 'Todos';
  renderFiltros();
  renderProdutos();
}

function renderProdutos() {
  var busca = document.getElementById('busca').value.toLowerCase();
  var lista = state.produtos.filter(function(p){
    var catOk = filtroAtivo === 'Todos' || p.categoria === filtroAtivo;
    var buscaOk = !busca || p.nome.toLowerCase().indexOf(busca)>=0 || p.categoria.toLowerCase().indexOf(busca)>=0;
    return catOk && buscaOk;
  });
  var el = document.getElementById('gridProdutos');
  if (lista.length === 0) {
    el.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>Nenhum produto encontrado</p></div>';
    return;
  }
  el.innerHTML = lista.map(function(p){
    var numStr = p.id ? p.id+'. ' : '';
    return '<div class="produto-card" onclick="adicionarAoCarrinho('+JSON.stringify(p.id||p.nome)+')">'+
      '<div class="cat-tag">'+p.categoria.split(' - ').pop()+'</div>'+
      '<div class="nome">'+numStr+p.nome+'</div>'+
      '<div class="preco">R$ '+p.preco.toFixed(2).replace('.',',')+'</div>'+
      '<button class="add-btn" onclick="event.stopPropagation();adicionarAoCarrinho('+JSON.stringify(p.id||p.nome)+')">+</button>'+
    '</div>';
  }).join('');
}

function getProduto(key) {
  return state.produtos.find(function(p){ return p.id===key||p.nome===key; });
}

function adicionarAoCarrinho(key) {
  var prod = getProduto(key);
  if (!prod) return;
  var key2 = prod.id||prod.nome;
  var item = state.carrinho.find(function(i){ return (i.id||i.nome)===key2; });
  if (item) { item.qty++; }
  else { state.carrinho.push({id:prod.id,nome:prod.nome,preco:prod.preco,categoria:prod.categoria,qty:1,obs:''}); }
  renderCarrinho();
}

// ========== CARRINHO ==========
function renderCarrinho() {
  var el = document.getElementById('carrinho');
  if (state.carrinho.length===0){
    el.innerHTML='<div class="empty-state"><div class="icon">🛒</div><p>Carrinho vazio</p></div>';
  } else {
    el.innerHTML = state.carrinho.map(function(item,i){
      return '<div class="item-carrinho">'+
        '<div class="nome">'+item.nome+'</div>'+
        '<div class="item-ctrl">'+
          '<div class="qty-ctrl">'+
            '<button class="qty-btn minus" onclick="mudarQty('+i+',-1)">-</button>'+
            '<span class="qty-num">'+item.qty+'</span>'+
            '<button class="qty-btn plus" onclick="mudarQty('+i+',1)">+</button>'+
          '</div>'+
          '<span class="item-preco">R$ '+(item.preco*item.qty).toFixed(2).replace('.',',')+'</span>'+
          '<button class="item-del" onclick="removerItem('+i+')">🗑️</button>'+
        '</div>'+
      '</div>';
    }).join('');
  }
  var total = state.carrinho.reduce(function(s,i){return s+i.preco*i.qty;},0);
  document.getElementById('subtotal').textContent = 'R$ '+total.toFixed(2).replace('.',',');
  document.getElementById('total').textContent = 'R$ '+total.toFixed(2).replace('.',',');
  document.getElementById('numPedido').textContent = '#'+state.numPedido;
  calcTroco();
}

function mudarQty(i,d){
  state.carrinho[i].qty+=d;
  if(state.carrinho[i].qty<=0) state.carrinho.splice(i,1);
  renderCarrinho();
}
function removerItem(i){state.carrinho.splice(i,1);renderCarrinho();}
function limparCarrinho(){if(state.carrinho.length&&!confirm('Limpar carrinho?'))return;state.carrinho=[];renderCarrinho();}

// ========== PAGAMENTO ==========
function selecionarPgto(p){
  state.pgto=p;
  ['dinheiro','pix','debito','credito'].forEach(function(x){
    document.getElementById('pgto-'+x).classList.toggle('ativo',x===p);
  });
  document.getElementById('troco-field').style.display = p==='dinheiro'?'block':'none';
  calcTroco();
}

function calcTroco(){
  if(state.pgto!=='dinheiro')return;
  var total=state.carrinho.reduce(function(s,i){return s+i.preco*i.qty;},0);
  var rec=parseFloat(document.getElementById('valorRecebido').value)||0;
  var el=document.getElementById('trocoResult');
  if(rec>0){ var tr=rec-total; el.textContent=(tr>=0?'Troco: R$ '+tr.toFixed(2).replace('.',','):'⚠️ Valor insuficiente'); }
  else el.textContent='';
}

// ========== VENDA ==========
function finalizarVenda(){
  if(state.carrinho.length===0){alert('Carrinho vazio!');return;}
  var total=state.carrinho.reduce(function(s,i){return s+i.preco*i.qty;},0);
  var obs=document.getElementById('obsVenda').value;
  var venda={
    id:state.numPedido, data:new Date().toISOString(),
    operador:state.operador, estab:state.estab,
    itens:JSON.parse(JSON.stringify(state.carrinho)),
    total:total, pgto:state.pgto, obs:obs
  };
  if(state.pgto==='dinheiro'){
    var rec=parseFloat(document.getElementById('valorRecebido').value)||0;
    venda.recebido=rec; venda.troco=rec-total;
  }
  state.vendas.push(venda);
  localStorage.setItem('pdv_vendas',JSON.stringify(state.vendas));
  state.numPedido++;
  localStorage.setItem('pdv_numPedido',state.numPedido);
  localStorage.setItem('pdv_caixa',JSON.stringify({aberto:true,estab:state.estab,operador:state.operador,fundo:state.fundoCaixa,abertura:state.abertura,numPedido:state.numPedido}));
  mostrarRecibo(venda);
  state.carrinho=[];
  document.getElementById('obsVenda').value='';
  document.getElementById('valorRecebido').value='';
  document.getElementById('trocoResult').textContent='';
  renderCarrinho();
}

function mostrarRecibo(v){
  var itensStr=v.itens.map(function(i){
    return i.qty+'x '+i.nome+' = R$ '+(i.preco*i.qty).toFixed(2).replace('.',',');
  }).join('<br>');
  var extra='';
  if(v.pgto==='dinheiro'&&v.recebido){
    extra='<br>Recebido: R$ '+v.recebido.toFixed(2).replace('.',',')+
    '<br>Troco: R$ '+(v.troco>=0?v.troco:0).toFixed(2).replace('.',',');
  }
  var pgtoNomes={dinheiro:'💵 Dinheiro',pix:'📱 PIX',debito:'💳 Débito',credito:'💳 Crédito'};
  document.getElementById('reciboConteudo').innerHTML=
    '<div style="font-family:monospace;font-size:0.85em;line-height:1.8">'+
    '<div style="text-align:center;font-weight:700;font-size:1.1em">'+v.estab+'</div>'+
    '<div style="text-align:center;color:#aaa">PDV Pastelaria</div>'+
    '<hr style="border-color:#333;margin:10px 0">'+
    'Pedido: #'+v.id+'<br>'+
    'Data: '+new Date(v.data).toLocaleString('pt-BR')+'<br>'+
    'Operador: '+v.operador+
    '<hr style="border-color:#333;margin:10px 0">'+
    itensStr+
    '<hr style="border-color:#333;margin:10px 0">'+
    '<strong>TOTAL: R$ '+v.total.toFixed(2).replace('.',',')+'</strong><br>'+
    'Pagamento: '+(pgtoNomes[v.pgto]||v.pgto)+extra+
    (v.obs?'<br>Obs: '+v.obs:'')+
    '</div>';
  document.getElementById('modalRecibo').classList.add('show');
}

function fecharModal(id){document.getElementById(id).classList.remove('show');}

// ========== FECHAMENTO ==========
function gerarFechamento(){
  var agora=new Date();
  var totalVendas=state.vendas.reduce(function(s,v){return s+v.total;},0);
  var porPgto={dinheiro:0,pix:0,debito:0,credito:0};
  state.vendas.forEach(function(v){if(porPgto[v.pgto]!==undefined)porPgto[v.pgto]+=v.total;});
  var pgtoNomes={dinheiro:'💵 Dinheiro',pix:'📱 PIX',debito:'💳 Débito',credito:'💳 Crédito'};
  var resumoPgto=Object.keys(porPgto).map(function(k){
    return '<div class="resumo-item"><div class="label">'+pgtoNomes[k]+'</div><div class="valor">R$ '+porPgto[k].toFixed(2).replace('.',',')+'</div></div>';
  }).join('');
  document.getElementById('fechamentoConteudo').innerHTML=
    '<div style="margin-bottom:15px;color:#aaa;font-size:0.85em">'+
    'Abertura: '+new Date(state.abertura).toLocaleString('pt-BR')+'<br>'+
    'Fechamento: '+agora.toLocaleString('pt-BR')+'<br>'+
    'Operador: '+state.operador+
    '</div>'+
    '<div class="resumo-grid">'+
    '<div class="resumo-item"><div class="label">Fundo de Caixa</div><div class="valor">R$ '+state.fundoCaixa.toFixed(2).replace('.',',')+'</div></div>'+
    '<div class="resumo-item"><div class="label">Nº de Vendas</div><div class="valor">'+state.vendas.length+'</div></div>'+
    '<div class="resumo-item"><div class="label">Total Vendas</div><div class="valor">R$ '+totalVendas.toFixed(2).replace('.',',')+'</div></div>'+
    '<div class="resumo-item"><div class="label">Total Geral</div><div class="valor destaque">R$ '+(state.fundoCaixa+totalVendas).toFixed(2).replace('.',',')+'</div></div>'+
    resumoPgto+
    '</div>';
}

function fecharCaixaDefinitivo(){
  if(!confirm('Fechar o caixa e reiniciar o sistema?'))return;
  localStorage.removeItem('pdv_caixa');
  localStorage.removeItem('pdv_vendas');
  localStorage.removeItem('pdv_numPedido');
  state.caixaAberto=false; state.vendas=[]; state.carrinho=[]; state.numPedido=1; state.abertura=null;
  mostrarTela('abertura');
}

// ========== HISTÓRICO ==========
function gerarHistorico(){
  var pgtoNomes={dinheiro:'Dinheiro',pix:'PIX',debito:'Débito',credito:'Crédito'};
  if(state.vendas.length===0){
    document.getElementById('historicoConteudo').innerHTML='<div class="empty-state"><div class="icon">📋</div><p>Nenhuma venda registrada</p></div>';
    return;
  }
  var rows=state.vendas.slice().reverse().map(function(v){
    return '<tr><td>#'+v.id+'</td><td>'+new Date(v.data).toLocaleTimeString('pt-BR')+'</td>'+
    '<td>'+v.itens.length+' item(s)</td><td>R$ '+v.total.toFixed(2).replace('.',',')+'</td>'+
    '<td>'+(pgtoNomes[v.pgto]||v.pgto)+'</td>'+
    '<td><button class="btn btn-secondary btn-sm" onclick="mostrarRecibo('+JSON.stringify(JSON.stringify(v)).slice(1,-1)+')">🧾 Ver</button></td>'+
    '</tr>';
  }).join('');
  document.getElementById('historicoConteudo').innerHTML=
    '<table><thead><tr><th>#</th><th>Hora</th><th>Itens</th><th>Total</th><th>Pagamento</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>';
}

// ========== PRODUTOS ADMIN ==========
function gerarProdutosAdmin(){
  var cats=[...new Set(state.produtos.map(function(p){return p.categoria;}))];
  var html='';
  cats.forEach(function(cat){
    var itens=state.produtos.filter(function(p){return p.categoria===cat;});
    html+='<div style="margin-bottom:20px"><h4 style="color:#c0392b;margin-bottom:8px">'+cat+'</h4>'+
    '<table><thead><tr><th>#</th><th>Produto</th><th>Preço</th><th></th></tr></thead><tbody>'+
    itens.map(function(p){
      var idx=state.produtos.indexOf(p);
      return '<tr><td style="color:#666">'+(p.id||'-')+'</td>'+
      '<td>'+p.nome+'</td>'+
      '<td><input type="number" value="'+p.preco+'" step="0.01" min="0" style="width:90px;background:#1a1a2e;border:1px solid #c0392b33;border-radius:5px;color:#fff;padding:4px 8px" onchange="atualizarPreco('+idx+',this.value)"></td>'+
      '<td><button class="btn btn-danger btn-sm" onclick="removerProduto('+idx+')">🗑️</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  });
  html+='<button class="btn btn-primary" onclick="resetarProdutos()" style="margin-top:10px">🔄 Restaurar padrão</button>';
  document.getElementById('produtosAdminConteudo').innerHTML=html;
}

function atualizarPreco(idx,val){
  state.produtos[idx].preco=parseFloat(val)||0;
  localStorage.setItem('pdv_produtos',JSON.stringify(state.produtos));
}
function removerProduto(idx){
  if(!confirm('Remover este produto?'))return;
  state.produtos.splice(idx,1);
  localStorage.setItem('pdv_produtos',JSON.stringify(state.produtos));
  gerarProdutosAdmin();
}
function resetarProdutos(){
  if(!confirm('Restaurar todos os produtos para o padrão?'))return;
  state.produtos=JSON.parse(JSON.stringify(PRODUTOS_DEFAULT));
  localStorage.setItem('pdv_produtos',JSON.stringify(state.produtos));
  gerarProdutosAdmin();
}

// Iniciar filtro padrão de pagamento
selecionarPgto('dinheiro');
window.onload = init;
</script>
